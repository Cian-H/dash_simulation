[tool.poetry]
name = "dash-simulation"
version = "0.1.0"
description = "A simulation of a dashboard in a live printing environment"
authors = ["Cian Hughes <chughes000@gmail.com>"]
readme = "README.md"
packages = [{ include = "src", from = "." }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
loguru = "^0.7.2"
watchdog = "^6.0.0"
mtpy = { git = "https://github.com/Cian-H/MTPy" }
dask = { extras = ["complete"], version = "^2024.10.0" }
panel = "^1.5.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
